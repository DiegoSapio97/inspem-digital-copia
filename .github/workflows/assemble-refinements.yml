name: Assemble refinements.css
on:
  workflow_dispatch:
  push:
    paths:
      - "src/styles/parts/**"
      - ".github/workflows/assemble-refinements.yml"
      - "src/styles/refinements.css"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble full CSS from parts
        run: |
          if [ ! -d src/styles/parts ]; then
            echo "Parts already assembled; nothing to do"
            exit 0
          fi
          cat src/styles/parts/part-*.css > src/styles/refinements.css
          rm -rf src/styles/parts
          rm -f .github/workflows/assemble-refinements.yml
          wc -c src/styles/refinements.css
          head -c 80 src/styles/refinements.css; echo
          grep -n "Rodapé institucional\|Páginas legais" src/styles/refinements.css
      - name: Commit assembled refinements.css
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Adiciona estilos das páginas legais e links do rodapé"
          git push
